def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

group 'com.kanbanbox.nimmsta_sdk'
version '1.3'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://maven.goma-cms.org/repository/nimmsta-core-release/'
            credentials {
                username = localProperties.getProperty('nimmsta.username')
                password = localProperties.getProperty('nimmsta.password')
            }
            authentication {
                basic(BasicAuthentication)
            }
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "com.kanbanbox.nimmsta"
    compileSdkVersion 36

    defaultConfig {
        minSdkVersion 21
    }

    packagingOptions {
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/io.netty.versions.properties'
    }
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'
}

dependencies {
    api("com.nimmsta.core:shared-android:6.0.6279@aar")
    api("com.nimmsta.core:android:6.0.2781@aar") {
        transitive = true
        changing = true
    }
    implementation "androidx.appcompat:appcompat:1.7.1"
}